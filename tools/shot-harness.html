<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BOSS 直聘（截图替身页）</title>
<style>
  /* 粗略模拟 BOSS 搜索页底色，用于观察面板在真实背景上的对比与遮挡 */
  body { margin:0; font-family:-apple-system,"Microsoft YaHei",sans-serif; background:#f5f6fa; }
  .fake-nav { height:60px; background:#fff; border-bottom:1px solid #e6e8eb; display:flex;
              align-items:center; padding:0 40px; gap:24px; color:#414a60; font-size:14px; }
  .fake-nav .logo { font-weight:700; color:#00a6a7; font-size:20px; }
  .fake-list { padding:24px 40px; display:flex; flex-direction:column; gap:12px; }
  .fake-card { background:#fff; border-radius:8px; padding:20px; height:96px;
               box-shadow:0 1px 3px rgba(0,0,0,.04); color:#61687c; }
  .fake-card b { color:#222; font-size:16px; }
  .fake-card .sal { color:#fe574a; font-weight:600; margin-left:12px; }
</style>
</head>
<body>
  <div class="fake-nav">
    <span class="logo">BOSS直聘</span>
    <span>职位</span><span>公司</span><span>我的简历</span><span>消息</span>
  </div>
  <div class="fake-list">
    <div class="fake-card"><b>C++开发工程师</b><span class="sal">20-35K</span><div>某某科技 · 深圳 · 3-5年 · 本科</div></div>
    <div class="fake-card"><b>Python后端开发</b><span class="sal">18-30K</span><div>某某网络 · 深圳 · 3-5年 · 本科</div></div>
    <div class="fake-card"><b>高级算法工程师</b><span class="sal">30-50K</span><div>某某智能 · 深圳 · 5-10年 · 硕士</div></div>
    <div class="fake-card"><b>Java开发工程师</b><span class="sal">15-28K</span><div>某某信息 · 深圳 · 3-5年 · 本科</div></div>
    <div class="fake-card"><b>前端开发工程师</b><span class="sal">18-32K</span><div>某某云 · 深圳 · 3-5年 · 本科</div></div>
  </div>

  <script>
    // ---- GM_* 桩：油猴 API 在普通页面不存在，需按真实语义补齐 ----
    // 用 localStorage 而非内存 Map：GM 存储的语义是「跨页面重载持久」，
    // 用 Map 的话 page.reload() 重建 JS 上下文就全丢了（会让"已配置"截图
    // 变成未配置态）。前缀 gm: 避免与替身页自身的键冲突。
    const GK = (k) => 'gm:' + k
    window.GM_getValue = (k, d) => {
      const v = localStorage.getItem(GK(k))
      return v === null ? d : v
    }
    window.GM_setValue = (k, v) => { localStorage.setItem(GK(k), String(v)) }
    window.GM_deleteValue = (k) => { localStorage.removeItem(GK(k)) }
    window.GM_listValues = () =>
      Object.keys(localStorage).filter((k) => k.startsWith('gm:')).map((k) => k.slice(3))
    window.GM_addStyle = (css) => {
      const s = document.createElement('style'); s.textContent = css; document.head.append(s)
    }
    window.GM_notification = () => {}

    // 网络桩：不打真后端，但要按各端点返回**合理形状**的响应。
    // 早先图省事一律返 401，结果面板按真实逻辑判定「Token 过期」→ 清掉
    // token/resumeId 并存盘 → 已配置态截图全变成未配置态。这不是 UI 的 bug，
    // 是桩不合理：401 就该触发登出，代码是对的。
    window.GM_xmlhttpRequest = (o) => {
      const url = String(o.url || '')
      if (url.includes('/api/plugin/config')) {
        const body = JSON.stringify({
          resumes: [
            { id: 1, name: '后端开发-张三.pdf', skills_count: 27 },
            { id: 2, name: '算法岗-张三.pdf', skills_count: 19 },
          ],
          default_threshold: 60,
          supported_platforms: ['zhipin', 'zhaopin', 'liepin', 'qiancheng'],
          preferences: { keyword: 'C++', city: '深圳', threshold: 65, apply_limit: 10 },
        })
        setTimeout(() => o.onload && o.onload({ status: 200, responseText: body }), 10)
        return
      }

      // 其余端点走真 fetch —— 这样 Playwright 的 ctx.route() 能拦到并注入桩数据，
      // 桩数据得以留在 shoot.py 里（HR_LIST_STUB），不必两处维护。
      // 之前这里是纯同步返回 '{}'，route 永远拦不到，会话卡片截不出来。
      fetch(url, {
        method: o.method || 'GET',
        headers: o.headers || {},
        body: o.data,
      })
        .then(async (resp) => {
          const text = await resp.text()
          o.onload && o.onload({ status: resp.status, responseText: text })
        })
        .catch(() => {
          // 没被 route 覆盖的端点：返空对象，行为与改造前一致
          o.onload && o.onload({ status: 200, responseText: '{}' })
        })
    }
  </script>
  <script src="./vue.global.prod.js"></script>
  <script src="./bundle.user.js"></script>
</body>
</html>
